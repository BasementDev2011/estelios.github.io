<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estelios</title>

<style>
body
{
    margin: 0;
    background: #111;
    font-family: Arial, sans-serif;
}

header
{
    text-align: center;
    padding: 20px;
    font-size: 28px;
    color: white;
}

.gallery
{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    padding: 10px;
}

.gallery img
{
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    cursor: pointer;
}

.marquee
{
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    background: #1a1a1a;
    color: white;
    padding: 10px 0;
    box-sizing: border-box;
}

.marquee span
{
    display: inline-block;
    padding-left: 100%;
    animation: marquee-scroll 12s linear infinite;
}

@keyframes marquee-scroll
{
    from
    {
        transform: translateX(0%);
    }

    to
    {
        transform: translateX(-100%);
    }
}

.popup
{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.popup img
{
    max-width: 95%;
    max-height: 95%;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
Estelios - The archive!

<div class="marquee">
    <span>
        Welcome to the archive / Occational new uploads
    </span>
</div>

RIP Estelios (2006 - 2026)
</header>

<div class="gallery" id="gallery"></div>

<div class="popup" id="popup">
    <img id="popupImage">
</div>

<script src="images.js"></script>

<script>
const gallery = document.getElementById("gallery");
const popup = document.getElementById("popup");
const popupImage = document.getElementById("popupImage");

for (const file of imageFiles)
{
    const img = document.createElement("img");

    img.src = file;

    img.onclick = function()
    {
        popup.style.display = "flex";
        popupImage.src = file;
    };

    gallery.appendChild(img);
}

popup.onclick = function()
{
    popup.style.display = "none";
};
</script>

</body>
</html>
